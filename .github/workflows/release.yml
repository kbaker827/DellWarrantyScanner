name: Build Windows release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the zip to (e.g. v1.1.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish win-x64 (framework-dependent)
        run: dotnet publish -c Release -r win-x64 -o publish

      - name: Zip the publish output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "DellWarrantyScanner-${{ env.TAG_NAME }}-win-x64.zip"

      - name: Attach zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.TAG_NAME }}" "DellWarrantyScanner-${{ env.TAG_NAME }}-win-x64.zip" --clobber
